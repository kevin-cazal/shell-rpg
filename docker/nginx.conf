# The app is served under /runtime/v86/latest/ — the path the workshop platform
# embeds it at (/runtime/<id>/<version>/, same origin as CTFd; the platform's
# id for this runtime is `v86`). Vite bakes that base into the dist (VITE_BASE
# in the Dockerfile), so the files live at that same path under the document
# root and no rewrite is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative: behind TLS-terminating ingress, nginx sees http.
    absolute_redirect off;

    # Required for v86 SharedArrayBuffer (same as Vite dev/preview)
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    # The platform shows this app in a same-origin iframe: SAMEORIGIN, not DENY.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Standalone convenience (docker run): land on the app.
    location = / {
        return 302 /runtime/v86/latest/;
    }

    # Exact match, so the bare path is not read as a version by the regex below
    # (which would redirect it to itself).
    location = /runtime/v86/latest {
        return 301 /runtime/v86/latest/;
    }

    # `^~` so the version-redirect regex below is not consulted for this prefix.
    location ^~ /runtime/v86/latest/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /runtime/v86/latest/index.html;
    }

    # Any other version of this runtime (a subject still pinning a commit sha)
    # goes to the one build this image carries.
    location ~ ^/runtime/v86/[^/]+(/.*)?$ {
        return 302 /runtime/v86/latest$1$is_args$args;
    }

    location ~ \.wasm$ {
        default_type application/wasm;
    }

    location ~ \.(v86b|v86state|img|raw)$ {
        default_type application/octet-stream;
    }
}
